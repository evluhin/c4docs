name: release

on:
  workflow_dispatch:

permissions:
  id-token: write # Required for NPM Trusted publishing
  actions: write
  checks: write
  contents: write
  statuses: write

env:
  NODE_ENV: production
  CLOUDFLARE_ENV: production
  FORCE_COLOR: true
  DO_NOT_TRACK: '1'

jobs:
  publish:
    name: 📦 npm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    if: ${{ github.repository_owner == 'evluhin' }}
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🛠️ Setup pnpm
        uses: pnpm/action-setup@v6
        env:
          NODE_ENV: development

      - name: 🛠️ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24' # Required for OIDC publishing
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: 🛠️ Cache for turbo
        uses: rharkor/caching-for-turbo@v2.5.2
        with:
          cache-prefix: 'turbo_cache_${{ runner.arch }}'

      - run: pnpm install --prefer-offline
        env:
          HUSKY: '0'
          NODE_ENV: development

      - name: ⚙️ build
        run: pnpm ci:build

      # OIDC Trusted Publishing requires npm CLI >= 11.5.1; the npm bundled with
      # Node 24 in setup-node may be older, so upgrade it before publishing.
      - name: 🛠️ Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN: OIDC Trusted Publishing does not use a registry token.
      # secrets.GITHUB_TOKEN is a GitHub Actions token (not an npm token); passing
      # it forces npm into token auth and breaks OIDC.
      # Publish only the packages this fork ships (the CLI + its runtime deps),
      # which are the ones configured with an npm Trusted Publisher. A bare `-r`
      # would try to publish every public package and abort on the first one
      # without a Trusted Publisher (OIDC 404).
      - name: 📦 publish
        run: >-
          pnpm
          --filter @c4docs/likec4
          --filter @c4docs/likec4-core
          --filter @c4docs/likec4-icons
          publish --no-git-checks --provenance --access public

  create-tag:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    needs: publish
    steps:
      - name: Decode the GitHub App Private Key
        id: decode
        run: |
          private_key=$(echo "${{ secrets.BOT_APP_PRIVATE_KEY }}" | base64 -d | awk 'BEGIN {ORS="\\n"} {print}' | head -c -2) &> /dev/null
          echo "::add-mask::$private_key"
          echo "private-key=$private_key" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ steps.decode.outputs.private-key }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Read version
        id: read-version
        run: |
          echo "VERSION=$(jq -r .version package.json)" >> "$GITHUB_ENV"

      - name: Create release
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const version = process.env.VERSION
            const tagname = `v${version}`
            github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagname,
              target_commitish: context.sha,
              name: tagname,
              draft: true,
              generate_release_notes: true,
            })
