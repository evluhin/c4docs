packages:
  - .

allowBuilds:
  esbuild: true
  sharp: false
  workerd: true

# Every `@c4docs/likec4-*` package in the transitive closure must be listed here, not just the
# direct dependencies of this workspace. `pnpm pack` rewrites `workspace:*` to an exact
# version, so a packed tarball asks for e.g. `@c4docs/likec4-language-services@<version>` from the
# registry. On a release commit that version is not published yet, and the install fails with
# ERR_PNPM_NO_MATCHING_VERSION. Overriding every one of them to its local tarball keeps the
# whole closure resolving from the build instead of from npm.
overrides:
  "@c4docs/likec4-config": "file:../packages/config/package.tgz"
  "@c4docs/likec4-core": "file:../packages/core/package.tgz"
  "@c4docs/likec4-diagram": "file:../packages/diagram/package.tgz"
  "@c4docs/likec4-generators": "file:../packages/generators/package.tgz"
  "@c4docs/likec4-icons": "file:../packages/icons/package.tgz"
  "@c4docs/likec4-language-server": "file:../packages/language-server/package.tgz"
  "@c4docs/likec4-language-services": "file:../packages/language-services/package.tgz"
  "@c4docs/likec4-layouts": "file:../packages/layouts/package.tgz"
  "@c4docs/likec4-log": "file:../packages/log/package.tgz"
  "@c4docs/likec4-mcp": "file:../packages/mcp/package.tgz"
  "@c4docs/likec4-style-preset": "file:../styled-system/preset/package.tgz"
  "@c4docs/likec4-styles": "file:../styled-system/styles/package.tgz"
  "@c4docs/likec4": "file:../packages/likec4/package.tgz"
